{% extends 'base.html' %}
{% block content %}<h1>选一个知识点 开始练习</h1><p>先独立作答，再查看标准解析或请求讲解。</p>
<form method="get"><label>知识点 <select name="point"><option value="">全部</option>
{% for point in points %}<option value="{{ point.code }}" {% if selected_point == point.code %}selected{% endif %}>{{ point.title }}</option>{% endfor %}
</select></label><button>筛选</button></form>
{% for question in questions %}<article class="panel"><span class="tag">{{ question.point.title }}</span>
<h2>{{ question.stem }}</h2><a class="button" href="{% url 'practice:question' question.pk %}">开始作答</a></article>
{% empty %}<p>暂无题目。请先运行 seed_demo，或由教师添加已发布题目。</p>{% endfor %}{% endblock %}
